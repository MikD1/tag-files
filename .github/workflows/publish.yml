name: Publish
on:
  release:
    types: [published]
permissions:
  contents: read
jobs:
  validate-release:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate version and stable/prerelease channel policy
        env:
          RELEASE_VERSION: ${{ github.event.release.tag_name }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
        run: scripts/release-images validate-release --version "$RELEASE_VERSION" --prerelease "$RELEASE_PRERELEASE"
  verify:
    needs: validate-release
    uses: ./.github/workflows/verify.yml
    with:
      version: ${{ github.event.release.tag_name }}
      export-images: true
  publish:
    needs: verify
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Download tested amd64 image archives and sealed receipt
        uses: actions/download-artifact@v4
        with:
          name: verified-images-${{ github.run_id }}-${{ github.run_attempt }}-amd64
          path: ${{ runner.temp }}/verified-images/amd64
      - name: Download tested arm64 image archives and sealed receipt
        uses: actions/download-artifact@v4
        with:
          name: verified-images-${{ github.run_id }}-${{ github.run_attempt }}-arm64
          path: ${{ runner.temp }}/verified-images/arm64
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Push tested config/layers and assemble version/minor/latest manifests
        env:
          RELEASE_VERSION: ${{ github.event.release.tag_name }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
        run: scripts/release-images promote --version "$RELEASE_VERSION" --prerelease "$RELEASE_PRERELEASE" --directory "$RUNNER_TEMP/verified-images"
      - name: Attach the standalone installer and Compose template to the stable release
        if: ${{ !github.event.release.prerelease }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ github.event.release.tag_name }}
        run: |
          scripts/release-images installer-assets --version "$RELEASE_VERSION" --directory "$RUNNER_TEMP/installer-assets"
          gh release upload "$RELEASE_VERSION" "$RUNNER_TEMP/installer-assets/setup.sh" "$RUNNER_TEMP/installer-assets/compose.yml" "$RUNNER_TEMP/installer-assets/SHA256SUMS" --clobber
      - name: Retain publication digest receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: publication-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/verified-images/publication.json
          if-no-files-found: warn
          retention-days: 30
