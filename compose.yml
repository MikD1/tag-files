name: tag-files

services:
  app:
    image: ${TAG_FILES_APP_IMAGE:?Set the versioned application image}
    ports:
      - "127.0.0.1:${TAG_FILES_PORT:-8080}:8080"
    environment:
      TAG_FILES_S3_ENDPOINT: http://storage:8333
      TAG_FILES_WEB_DIR: /usr/share/tag-files/web
      TAG_FILES_MIN_FREE_BYTES: ${TAG_FILES_MIN_FREE_BYTES:-1073741824}
    volumes:
      - app_data:/data
      - scratch:/scratch
    secrets:
      - s3_access_key
      - s3_secret_key
    depends_on:
      storage:
        condition: service_healthy
    networks: [frontend, library]
    read_only: true
    stop_grace_period: 2m
    restart: unless-stopped

  storage:
    image: ${TAG_FILES_STORAGE_IMAGE:?Set the versioned storage image}
    volumes:
      - storage_data:/data
    secrets:
      - s3_access_key
      - s3_secret_key
    networks: [library]
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    stop_grace_period: 2m
    restart: unless-stopped

networks:
  frontend:
  library:
    internal: true

volumes:
  app_data:
  storage_data:
  scratch:

secrets:
  s3_access_key:
    file: ./secrets/s3_access_key
  s3_secret_key:
    file: ./secrets/s3_secret_key
